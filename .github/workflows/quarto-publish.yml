on:
  push:
    branches:
      - main

name: Render and Publish

# you need these permissions to publish to GitHub pages
permissions:
    contents: write
    pages: write

jobs:
  build-deploy:
    # runs-on: ubuntu-latest
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      # - run: pip install -e .

      # Quarto starts a Jupyter kernel to render workflow.py (percent format),
      # even though its cells are `eval: false`
      - name: Install Jupyter
        run: pip install jupyter

      # - uses: r-lib/actions/setup-r@v2
      # - uses: r-lib/actions/setup-r-dependencies@v2
      #   with:
      #     packages: |
      #       any::downloadthis
      #     # extra-packages: |
      #     #   any::downloadthis

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        # with:
        #   # To install LaTeX to build PDF book (needed only if a pdf format
        #   # or a `downloads: [pdf]` book option is added back)
        #   tinytex: true
        #   # uncomment below and fill to pin a version
        #   # version: SPECIFIC-QUARTO-VERSION-HERE

      # The site is HTML only: no LaTeX (thesis/PDF download) and no Chrome
      # (reveal.js slides) are needed. Re-add `quarto install tinytex` and
      # browser-actions/setup-chrome here if either comes back.

      - name: Render Quarto Project - default profile
        uses: quarto-dev/quarto-actions/render@v2
        env:
          QUARTO_PROFILE: default
        with:
          path: .
          to: html

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # this secret is always available for github actions

    permissions:
      contents: write
#     pages: write
